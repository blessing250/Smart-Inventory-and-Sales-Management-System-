    ProcurementContactInput:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [SUPPLIER, AGENT] }
        name: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        location: { type: string, maxLength: 200 }
    PurchaseInput:
      type: object
      required: [supplierId, reference, date, currency, rateMicros, lines]
      properties:
        supplierId: { type: string }
        reference: { type: string }
        invoiceReference: { type: string }
        date: { type: string, format: date }
        currency: { type: string, enum: [RWF, USD, CNY] }
        rateMicros: { type: integer, minimum: 1, maximum: 10000000000, description: RWF per source major unit multiplied by one million. RWF orders use 1000000. }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [productId, quantity, unitMinor]
            properties:
              productId: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 1000000 }
              unitMinor: { type: integer, minimum: 0, maximum: 1000000000 }
    ShipmentManifestInput:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [lineId, quantity]
            properties:
              lineId: { type: string, description: Purchase line identifier. }
              quantity: { type: integer, minimum: 1, maximum: 1000000 }
    ShipmentInput:
      allOf:
        - $ref: '#/components/schemas/ShipmentManifestInput'
        - type: object
          required: [tracking, agentId, plannedDate]
          properties:
            tracking: { type: string }
            agentId: { type: string }
            plannedDate: { type: string, format: date }
            arrivalDate: { type: string, format: date }
    ShipmentChargesInput:
      type: object
      required: [allocation, shipping, customs, clearing, other]
      properties:
        allocation: { type: string, enum: [QUANTITY, VALUE] }
        shipping: { type: integer, minimum: 0, maximum: 1000000000 }
        customs: { type: integer, minimum: 0, maximum: 1000000000 }
        clearing: { type: integer, minimum: 0, maximum: 1000000000 }
        other: { type: integer, minimum: 0, maximum: 1000000000 }
      description: All amounts use whole RWF.
    ShipmentReceiptInput:
      type: object
      required: [reference, date, lines]
      properties:
        reference: { type: string, description: Unique receipt reference used for retries. }
        date: { type: string, format: date }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [lineId, usable, damaged, missing]
            properties:
              lineId: { type: string, description: Manifest line identifier. }
              usable: { type: integer, minimum: 0, maximum: 1000000 }
              damaged: { type: integer, minimum: 0, maximum: 1000000 }
              missing: { type: integer, minimum: 0, maximum: 1000000 }
              explanation: { type: string, maxLength: 1000, description: Required when reporting damage or a shortage. }
    InventoryReference:
      type: object
      required: [reference, reason]
      properties:
        reference: {type: string, minLength: 1, maxLength: 150}
        reason: {type: string, minLength: 1, maxLength: 500}
    ProductForm:
      type: object
      properties:
        sku: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 200}
        category: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 4000}
        supplierLabel: {type: string, maxLength: 200}
        variantSize: {type: string, maxLength: 100}
        variantColor: {type: string, maxLength: 100}
        variantMaterial: {type: string, maxLength: 100}
        variantDesign: {type: string, maxLength: 100}
        sellingPrice: {type: integer, minimum: 0, maximum: 1000000000}
        estimatedUnitCost: {type: integer, minimum: 0, maximum: 1000000000}
        reorderThreshold: {type: integer, minimum: 0, maximum: 1000000}
    RecoveryToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
  parameters:
    InventoryId: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    InventoryPage: {in: query, name: page, schema: {type: integer, minimum: 0, default: 0}}
    InventorySize: {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    InventoryFrom: {in: query, name: from, description: Inclusive Kigali business date., schema: {type: string, format: date}}
    InventoryTo: {in: query, name: to, description: Inclusive Kigali business date., schema: {type: string, format: date}}
    CatalogId: {in: path, name: id, required: true, schema: {type: string}}
  requestBodies:
    FamilyForm:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
