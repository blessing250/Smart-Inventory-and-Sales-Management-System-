        '400': { description: Invalid request or filters. }
        '401': { description: An active owner session is required. }
        '403': { description: The origin or access is forbidden. }
  /api/v1/products/import/preview:
    post:
      operationId: previewCatalogImport
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogImportRequest'}
      responses:
        '200':
          description: Validation errors, stock warnings and proposed action for each sheet row.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CatalogImportResult'}}
        '400': {description: Invalid file mapping request.}
        '401': {description: Owner session required.}
  /api/v1/products/import/confirm:
    post:
      operationId: confirmCatalogImport
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/CatalogImportRequest'}
                - {required: [reference]}
      responses:
        '200':
          description: Import outcome. A retry with the same reference and input returns the original result.
          content:
            application/json:
              schema:
                type: object
                required: [created, updated, skipped, rows]
                properties:
                  created: {type: integer}
                  updated: {type: integer}
                  skipped: {type: integer}
                  rows: {type: array, items: {$ref: '#/components/schemas/CatalogImportResult'}}
        '400': {description: Validation failed.}
        '401': {description: Owner session required.}
        '409': {description: Conflicting retry reference or concurrent SKU change.}
  /api/v1/settings:
    get:
      operationId: getBusinessProfile
      security: [{ownerBearer: []}]
      responses:
        '200':
          description: Current business profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessProfile'}
        '401': {description: Owner session required.}
    put:
      operationId: updateBusinessProfile
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BusinessProfile'}
      responses:
        '200':
          description: Updated profile with an owner audit event.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessProfile'}
        '400': {description: Invalid profile.}
        '401': {description: Owner session required.}
components:
  securitySchemes:
    ownerBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    BusinessProfile:
      type: object
      required: [name, address, phone, receiptFooter]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        address: {type: string, maxLength: 500}
        phone: {type: string, maxLength: 100}
        receiptFooter: {type: string, maxLength: 500}
    CatalogImportRequest:
      type: object
      required: [mode, rows]
      properties:
        mode: {type: string, enum: [SKIP, UPDATE]}
        reference: {type: string, maxLength: 150}
        rows:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [product]
            properties:
              quantity: {type: integer, minimum: 0, maximum: 1000000, description: Validation only. The import has no stock effect.}
              product:
                type: object
                required: [sku, name, category, sellingPrice]
                properties:
                  sku: {type: string, maxLength: 100}
                  name: {type: string, maxLength: 200}
                  category: {type: string, maxLength: 100}
                  description: {type: string, maxLength: 4000}
                  supplierLabel: {type: string, maxLength: 200}
                  familyId: {type: string, maxLength: 150}
                  variantSize: {type: string, maxLength: 100}
                  variantColor: {type: string, maxLength: 100}
                  variantMaterial: {type: string, maxLength: 100}
                  variantDesign: {type: string, maxLength: 100}
                  sellingPrice: {type: integer, minimum: 0, maximum: 1000000000}
                  estimatedUnitCost: {type: integer, minimum: 0, maximum: 1000000000}
                  reorderThreshold: {type: integer, minimum: 0, maximum: 1000000}
    CatalogImportResult:
      type: object
      required: [row, sku, name, action, errors, warnings]
      properties:
        row: {type: integer, minimum: 1}
        sku: {type: [string, 'null']}
        name: {type: [string, 'null']}
        action: {type: string, enum: [CREATE, UPDATE, SKIP]}
        errors: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    NativeAccountInput:
      type: object
      required: [name, kind, currency]
      properties:
        name: { type: string }
        kind: { type: string, enum: [CASH, BANK, MOBILE_MONEY] }
        currency: { type: string, enum: [USD, CNY] }
        openingMinor: { type: integer, minimum: 0 }
        rwfRateMicros: { type: integer, minimum: 1 }
    ExchangeInput:
      type: object
      required: [reference, fromAccount, toAccount, sourceMinor, destinationMinor, rwfRateMicros]
      properties:
        reference: { type: string }
        fromAccount: { type: string }
        toAccount: { type: string }
        sourceMinor: { type: integer, minimum: 1 }
        destinationMinor: { type: integer, minimum: 1 }
        feeMinor: { type: integer, minimum: 0 }
        rwfRateMicros: { type: integer, minimum: 1 }
        exchangeRateMicros: { type: integer, minimum: 1 }
        date: { type: string, format: date }
    CorrectionInput:
      type: object
      required: [reference, reason]
      properties:
        reference: { type: string, maxLength: 150 }
        reason: { type: string, maxLength: 500 }
    ReportPage:
      type: object
      required: [title, total, page, size, columns, rows, totals]
      properties:
        title: { type: string }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
        columns:
          type: array
          items:
            type: object
            required: [key, label, numeric, unit]
            properties:
              key: { type: string }
              label: { type: string }
              numeric: { type: boolean }
              unit: { type: string }
        rows: { type: array, items: { type: object } }
        totals: { type: object, additionalProperties: { type: number } }
        brand: {$ref: '#/components/schemas/BusinessProfile'}
    FinanceNameInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    FinanceCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        active: { type: boolean }
    FinanceExpenseInput:
      type: object
