openapi: 3.1.0
info:
  title: BizFlow Jewelry Spring API
  version: 0.9.0
paths:
  /api/health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: The API process can respond.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /api/health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: PostgreSQL is reachable and the foundation migration is visible.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ready
        '503':
          description: PostgreSQL or the foundation schema is unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: unavailable
  /api/v1/auth/login:
    post:
      operationId: loginOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, format: password, maxLength: 72}
      responses:
        '200':
          description: In-memory bearer session. No authentication cookie is set.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn]
                properties:
                  accessToken: {type: string}
                  tokenType: {const: Bearer}
                  expiresIn: {const: 600}
        '401': {description: Invalid email or password.}
        '429': {description: Sign-in rate limit reached.}
  /api/v1/auth/me:
    get:
      operationId: getOwnerProfile
      security:
        - ownerBearer: []
      responses:
        '200':
          description: Registered owner profile.
          content:
            application/json:
              schema:
                type: object
                required: [id, email, name, role]
                properties:
                  id: {type: string}
                  email: {type: string, format: email}
                  name: {type: string}
                  role: {const: OWNER}
        '401': {description: Missing or invalid session.}
  /api/v1/auth/logout:
    post:
      operationId: logoutOwner
      security:
        - ownerBearer: []
      responses:
        '204': {description: Session revoked.}
        '401': {description: Missing or invalid session.}
  /api/v1/auth/forgot-password:
    post:
      operationId: requestOwnerRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '202':
          description: Generic response for a valid request with email configured.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        '429': {description: Recovery request rate limit reached.}
        '503': {description: Email recovery unavailable.}
  /api/v1/auth/verify-reset:
    post:
      operationId: verifyOwnerRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {$ref: '#/components/schemas/RecoveryToken'}
      responses:
        '204': {description: Recovery token is valid.}
        '400': {description: Invalid or expired token.}
        '429': {description: Verification rate limit reached.}
  /api/v1/auth/reset-password:
    post:
      operationId: resetOwnerPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirmation]
              properties:
                token: {$ref: '#/components/schemas/RecoveryToken'}
                password: {type: string, format: password, minLength: 12, maxLength: 72}
                confirmation: {type: string, format: password, minLength: 12, maxLength: 72}
      responses:
        '204': {description: Password changed and prior sessions revoked.}
        '400': {description: Invalid, expired or consumed token, or unacceptable replacement password.}
        '429': {description: Password reset rate limit reached.}
  /api/v1/products:
    get:
      operationId: listProducts
      security: [{ownerBearer: []}]
      parameters:
        - {in: query, name: q, schema: {type: string, maxLength: 150}}
        - {in: query, name: category, schema: {type: string, maxLength: 100}}
        - {in: query, name: familyId, schema: {type: string}}
        - {in: query, name: status, schema: {enum: [active, archived, all], default: active}}
        - {in: query, name: sort, schema: {enum: [name, sku, newest], default: name}}
        - {in: query, name: page, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: Filtered catalog page with items and total.}
        '401': {description: Missing or invalid owner session.}
    post:
      operationId: createProduct
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ProductForm'}
                - required: [sku, name, category, sellingPrice, estimatedUnitCost, reorderThreshold]
                  properties:
                    familyId: {type: ['string', 'null'], maxLength: 150}
      responses:
        '201': {description: Product created without a stock movement.}
        '409': {description: Duplicate SKU.}
  /api/v1/products/{id}:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    get:
      operationId: getProduct
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Product details.}
        '404': {description: Product missing.}
    patch:
      operationId: updateProduct
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductForm'}
      responses:
        '200': {description: Product updated. Use the family endpoint to change family membership.}
        '409': {description: Duplicate SKU or archived product.}
  /api/v1/products/{id}/archive:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    post:
      operationId: archiveProduct
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Archived product details.}
  /api/v1/products/{id}/family:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    patch:
      operationId: assignProductFamily
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [familyId]
              properties:
                familyId: {type: ['string', 'null']}
      responses:
        '200': {description: Product with its updated family link.}
  /api/v1/products/{id}/image:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    get:
      operationId: getProductImage
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Binary contents in the detected image media type.}
        '404': {description: Image missing.}
    put:
      operationId: replaceProductImage
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary}
      responses:
        '204': {description: Image replaced.}
        '400': {description: Image contents or media type invalid.}
        '413': {description: Upload limit exceeded.}
  /api/v1/product-families:
    get:
      operationId: listProductFamilies
      security: [{ownerBearer: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 0, default: 0}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: Family page with items and total.}
    post:
      operationId: createProductFamily
      security: [{ownerBearer: []}]
      requestBody: {$ref: '#/components/requestBodies/FamilyForm'}
      responses:
        '201': {description: Family created.}
        '409': {description: Duplicate family name.}
  /api/v1/product-families/{id}:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    get:
      operationId: getProductFamily
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Family details.}
        '404': {description: Family missing.}
    patch:
      operationId: renameProductFamily
      security: [{ownerBearer: []}]
      requestBody: {$ref: '#/components/requestBodies/FamilyForm'}
      responses:
        '200': {description: Renamed family details.}
        '409': {description: Duplicate family name.}
  /api/v1/inventory/balances:
    get:
      operationId: listInventoryBalances
      security: [{ownerBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/InventoryPage'}
        - {$ref: '#/components/parameters/InventorySize'}
        - {in: query, name: q, schema: {type: string, maxLength: 150}}
      responses:
        '200': {description: Current balance page with items and total.}
  /api/v1/inventory/products/{id}/balance:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    get:
      operationId: getInventoryBalance
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Available quantity, whole RWF value and version.}
        '404': {description: Product missing.}
  /api/v1/inventory/movements:
    get:
      operationId: listInventoryMovements
      security: [{ownerBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/InventoryPage'}
        - {$ref: '#/components/parameters/InventorySize'}
        - {$ref: '#/components/parameters/InventoryFrom'}
        - {$ref: '#/components/parameters/InventoryTo'}
        - {in: query, name: productId, schema: {type: string}}
        - {in: query, name: q, schema: {type: string, maxLength: 150}}
        - {in: query, name: kind, schema: {enum: [OPENING, ADJUSTMENT, COUNT, DAMAGE_OUT, MISSING_OUT, REVERSAL, PURCHASE_RECEIPT, SALE, SALE_RETURN]}}
      responses:
        '200': {description: Filtered movement page with items and total.}
  /api/v1/inventory/movements/{id}:
    parameters: [{$ref: '#/components/parameters/InventoryId'}]
    get:
      operationId: getInventoryMovement
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Immutable movement including actor, reference and before/after balances.}
        '404': {description: Movement missing.}
  /api/v1/inventory/counts:
    get:
      operationId: listInventoryCounts
      security: [{ownerBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/InventoryPage'}
        - {$ref: '#/components/parameters/InventorySize'}
        - {$ref: '#/components/parameters/InventoryFrom'}
        - {$ref: '#/components/parameters/InventoryTo'}
        - {in: query, name: productId, schema: {type: string}}
        - {in: query, name: q, schema: {type: string, maxLength: 150}}
        - {in: query, name: status, schema: {enum: [all, pending, confirmed], default: all}}
      responses:
        '200': {description: Filtered count page with items and total.}
  /api/v1/inventory/counts/{id}:
    parameters: [{$ref: '#/components/parameters/InventoryId'}]
    get:
      operationId: getInventoryCount
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Count observations, actors, confirmation state and linked movement.}
        '404': {description: Count missing.}
  /api/v1/inventory/products/{id}/opening:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    post:
      operationId: postOpeningStock
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/InventoryReference'}
                - required: [quantity, valueRwf]
                  properties:
                    quantity: {type: integer, minimum: 1, maximum: 1000000000}
                    valueRwf: {type: integer, minimum: 0, maximum: 9007199254740991}
      responses:
        '201': {description: Opening movement posted.}
        '409': {description: Duplicate reference, archived product or inventory already moved.}
  /api/v1/inventory/products/{id}/adjustments:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    post:
      operationId: postStockAdjustment
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/InventoryReference'}
                - required: [type, quantity]
                  properties:
                    type: {enum: [INCREASE, DECREASE, DAMAGE_OUT, MISSING_OUT]}
                    quantity: {type: integer, minimum: 1, maximum: 1000000000}
      responses:
        '201': {description: Audited adjustment posted.}
        '409': {description: Duplicate reference, archived product or insufficient stock.}
  /api/v1/inventory/products/{id}/counts:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    post:
      operationId: draftInventoryCount
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/InventoryReference'}
                - required: [observedQuantity, expectedVersion]
                  properties:
                    observedQuantity: {type: integer, minimum: 0, maximum: 1000000000}
                    expectedVersion: {type: integer, minimum: 0}
      responses:
        '201': {description: Count prepared without changing stock.}
        '409': {description: Archived product, stale balance or duplicate reference.}
  /api/v1/inventory/counts/{id}/confirm:
    parameters: [{$ref: '#/components/parameters/InventoryId'}]
    post:
      operationId: confirmInventoryCount
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Confirmed count including the adjustment when required.}
        '409': {description: Archived product or stale balance.}
  /api/v1/inventory/movements/{id}/reverse:
    parameters: [{$ref: '#/components/parameters/InventoryId'}]
    post:
      operationId: reverseInventoryMovement
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryReference'}
      responses:
        '201': {description: Exact compensating movement posted.}
        '409': {description: Archived product, duplicate reference or movement ineligible for reversal.}
  /api/v1/inventory/products/{id}/unavailable:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    get:
      operationId: getUnavailableStock
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Recorded damage and loss from available stock. Awaiting receipt is null until receiving is integrated.}
  /api/v1/inventory/products/{id}/reconciliation:
    parameters: [{$ref: '#/components/parameters/CatalogId'}]
    get:
      operationId: reconcileInventory
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Read-only comparison of cached stock, ledger totals, count links and dispositions.}
  /api/v1/procurement-contacts:
    get:
      operationId: listProcurementContacts
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: kind
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated supplier and agent contacts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementContactPage' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
    post:
      operationId: createProcurementContact
      tags: [Procurement]
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcurementContactInput' }
      responses:
        '201':
          description: Supplier or shipping agent created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementContact' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
        '400': { description: Invalid request fields. }
        '409': { description: The reference or the current record state conflicts with the request. }
  /api/v1/purchases:
    get:
      operationId: listPurchases
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: supplierId
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated purchase summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementOrderPage' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
    post:
      operationId: createPurchase
      tags: [Procurement]
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseInput' }
      responses:
        '201':
          description: Purchase and its exchange-rate and line-cost snapshots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementOrderView' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
        '400': { description: Invalid request fields. }
        '409': { description: The reference or the current record state conflicts with the request. }
  /api/v1/purchases/{id}:
    get:
      operationId: getPurchase
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Purchase with received, reserved and outstanding quantities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementOrderView' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
        '404': { description: The requested record does not exist. }
  /api/v1/purchases/{id}/cancel:
    post:
      operationId: cancelPurchase
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Purchase cancelled if it has no active reservations or receipt history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementOrderView' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
        '404': { description: The requested record does not exist. }
        '400': { description: Invalid request fields. }
        '409': { description: The reference or the current record state conflicts with the request. }
  /api/v1/shipments:
    get:
      operationId: listShipments
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated shipment summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementShipmentPage' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
    post:
      operationId: createShipment
      tags: [Procurement]
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentInput' }
      responses:
        '201':
          description: Shipment created and manifest quantities reserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementShipmentView' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
        '400': { description: Invalid request fields. }
        '409': { description: The reference or the current record state conflicts with the request. }
  /api/v1/shipments/{id}:
    get:
      operationId: getShipment
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Shipment with manifest progress and charges.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementShipmentView' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
        '404': { description: The requested record does not exist. }
  /api/v1/shipments/{id}/manifest:
    put:
      operationId: replaceShipmentManifest
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentManifestInput' }
      responses:
        '200':
          description: Manifest replaced before the first receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementShipmentView' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
        '404': { description: The requested record does not exist. }
        '400': { description: Invalid request fields. }
        '409': { description: The reference or the current record state conflicts with the request. }
  /api/v1/shipments/{id}/charges:
    put:
      operationId: replaceShipmentCharges
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentChargesInput' }
      responses:
        '200':
          description: Charge totals and allocation basis replaced before the first receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementShipmentView' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
        '404': { description: The requested record does not exist. }
        '400': { description: Invalid request fields. }
        '409': { description: The reference or the current record state conflicts with the request. }
  /api/v1/shipments/{id}/cancel:
    post:
      operationId: cancelShipment
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Shipment closed and remaining reservations released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementShipmentView' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
        '404': { description: The requested record does not exist. }
        '400': { description: Invalid request fields. }
        '409': { description: The reference or the current record state conflicts with the request. }
  /api/v1/shipments/{id}/receipts:
    get:
      operationId: listShipmentReceipts
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated receipt history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementReceiptPage' }
        '401': { description: A valid owner access token is required. }
        '403': { description: The request lacks owner authorization or has an invalid origin. }
        '404': { description: The requested record does not exist. }
    post:
      operationId: receiveShipment
      tags: [Procurement]
      security:
        - ownerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
